function calcBoard(users,pays){

  }).sort((a,b)=>b.score-a.score);

async function verifySlip(imageData,totalAmount,items){
  ss({payAiLoading:true,payAiResult:null});
  try{
    const mt=imageData.startsWith('data:image/png')?'image/png':'image/jpeg';
    const b64=imageData.replace(/^data:image\/\w+;base64,/,'');
    const itemsText=items.map(i=>i.name+' ฿'+i.amount).join(', ');
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:800,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:mt,data:b64}},
          {type:'text',text:`ตรวจสอบสลิปโอนเงินห้องเรียน\nรายการ: ${itemsText}\nยอดที่ควรโอน: ฿${totalAmount}\nผู้รับ: นายนิติพัฒน์ ปัณราช (PromptPay)\n\nตอบ JSON เท่านั้น ไม่มี markdown:\n{"verdict":"likely_real|suspicious|fake","confidence":0-100,"amount_ok":true|false|null,"recipient_ok":true|false|null,"date_ok":true|false|null,"is_slip":true|false,"issues":[],"note":"คำอธิบายภาษาไทย"}`}
        ]}]
      })
    });
    const data=await resp.json();
    const txt=data.content?.filter(b=>b.type==='text').map(b=>b.text).join('')||'{}';
    const clean=txt.replace(/```json|```/g,'').trim();
    const result=JSON.parse(clean);
    ss({payAiResult:result,payAiLoading:false});
    return result;
  }catch(e){
    const result={verdict:'error',confidence:0,is_slip:null,amount_ok:null,recipient_ok:null,date_ok:null,issues:[],note:'ไม่สามารถวิเคราะห์ได้ Admin จะตรวจเอง'};
    ss({payAiResult:result,payAiLoading:false});
    return result;
  }
}

async function loadData(){
  const[uR,eR,pR,cR]=await Promise.all([
    db.from('users').select('*').order('id'),
    db.from('expenses').select('*').order('at'),
    db.from('payments').select('*').order('paid_at'),
    db.from('config').select('*'),
  ]);
  if(uR.error||eR.error){return false;}
  if(!uR.data.length){await db.from('users').insert(SEED_USERS);S.users=SEED_USERS;}
  else{S.users=uR.data;}
  if(!eR.data.length){await db.from('expenses').insert(SEED_EXP.map(e=>({id:e.id,name:e.name,amount:e.amount,desc:e.desc,at:e.at})));S.expenses=SEED_EXP;}
  else{S.expenses=eR.data;}
  S.payments=(pR.data||[]).map(p=>({...p,paidAt:p.paid_at}));
  const cfg=cR.data||[];
  const qrRow=cfg.find(r=>r.key==='qr');
  const balRow=cfg.find(r=>r.key==='savedBalance');
  if(qrRow?.value)S.qr=qrRow.value;
  if(balRow?.value)S.savedBalance=+balRow.value;
  return true;
}

  if(!r)return'';
  const cfg={

    suspicious:{cls:'bai-sus',icon:'ti-alert-triangle',label:'AI: น่าสงสัย'},

    error:{cls:'bai-err',icon:'ti-question-mark',label:'AI: ตรวจไม่ได้'},
  };
  const c=cfg[r.verdict]||cfg.error;
  const conf=r.confidence?` ${r.confidence}%`:'';
  if(compact)return`<span class="${c.cls}"><i class="ti ${c.icon}"></i>${c.label}${conf}</span>`;
  return`<div class="ai-card ai-${r.verdict==='likely_real'?'real':r.verdict==='suspicious'?'sus':r.verdict==='fake'?'fake':'err'}" style="margin-top:10px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">

      ${r.amount_ok===true?'<span class="bv" style="font-size:10px">ยอดตรง</span>':''}
      ${r.amount_ok===false?'<span class="bu" style="font-size:10px">ยอดไม่ตรง</span>':''}
      ${r.recipient_ok===true?'<span class="bv" style="font-size:10px">ชื่อตรง</span>':''}
    </div>
    ${r.note?`<div style="font-size:12px;color:rgba(255,255,255,.6);line-height:1.5">${r.note}</div>`:''}
    ${r.issues?.length?`<div style="font-size:11px;color:#ff7070;margin-top:5px">${r.issues.map(i=>`⚠ ${i}`).join(' · ')}</div>`:''}
  </div>`;
}

function renderUserChart(){
  const{expenses,payments,users,savedBalance}=S;
  const verified=payments.filter(p=>p.status==='verified');
  const got=verified.reduce((s,p)=>{const e=expenses.find(x=>x.id===p.eid);return s+(e?.amount||0)},0);
  const target=users.length*expenses.reduce((s,e)=>s+e.amount,0)||1;
  const grandTotal=savedBalance+got;
  const pct=Math.min(100,(got/target)*100);
  const sorted=[...verified].sort((a,b)=>a.paidAt-b.paidAt);
  let running=0;
  const pts=sorted.map(p=>{const e=expenses.find(x=>x.id===p.eid);running+=(e?.amount||0);return{ts:p.paidAt,amt:running};});
  const W=320,H=160,PL=50,PB=30,PT=12,PR=12,cW=W-PL-PR,cH=H-PT-PB;
  const maxV=Math.max(target,got,1);
  const barW=pts.length?Math.max(8,Math.min(30,Math.floor(cW/Math.max(pts.length,1)*.6))):20;
  const gap=pts.length>1?(cW-barW*pts.length)/(pts.length-1):0;
  const barsH=pts.map((p,i)=>{const bH=Math.round((p.amt/maxV)*cH);const x=PL+i*(barW+gap);const y=PT+cH-bH;return`<rect x="${x}" y="${y}" width="${barW}" height="${bH}" rx="3" fill="${i===pts.length-1?'rgba(0,212,255,.9)':'rgba(0,212,255,.45)'}"/>`;}).join('');
  const targetY=PT+cH-Math.round((target/maxV)*cH);
  const yLabels=[0,.5,1].map(f=>{const val=Math.round(maxV*f);const y=PT+cH-Math.round(f*cH);return`<text x="${PL-4}" y="${y+4}" text-anchor="end" font-size="9" fill="rgba(255,255,255,.3)">${val>=1000?(val/1000).toFixed(1)+'K':val}</text>`;}).join('');
  const svg=`<svg width="100%" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    ${yLabels}
    ${barsH}
    <line x1="${PL}" y1="${targetY}" x2="${W-PR}" y2="${targetY}" stroke="rgba(255,200,0,.5)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="${W-PR+2}" y="${targetY+3}" font-size="8" fill="rgba(255,200,0,.55)">เป้า</text>
    <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+cH}" stroke="rgba(255,255,255,.1)" stroke-width="1"/>
    <line x1="${PL}" y1="${PT+cH}" x2="${W-PR}" y2="${PT+cH}" stroke="rgba(255,255,255,.1)" stroke-width="1"/>
    ${!pts.length?`<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.25)">ยังไม่มีการยืนยัน</text>`:''}
  </svg>`;
  const expBars=expenses.map(e=>{
    const paid=payments.filter(p=>p.eid===e.id&&p.status==='verified').length;
    const pend=payments.filter(p=>p.eid===e.id&&p.status==='pending').length;
    const pp=Math.min(100,(paid/users.length)*100);
    const pendP=Math.min(100-pp,(pend/users.length)*100);
    const short=e.name.replace(/📚|🛡️|🎓/g,'').trim();
    return`<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px">
        <span style="font-size:13px;font-weight:500">${short}</span>
        <span class="num" style="font-size:12px;color:#00dc64">${thb(paid*e.amount)} <span style="color:rgba(255,255,255,.3);font-size:10px">${paid}/${users.length}</span></span>
      </div>
      <div class="pbar"><div class="pbar-fill" style="width:${pp.toFixed(1)}%;background:linear-gradient(90deg,#00b894,#00dc64);float:left"></div><div style="height:8px;width:${pendP.toFixed(1)}%;background:rgba(255,200,0,.5);float:left;border-radius:0 4px 4px 0"></div></div>
      ${pend>0?`<div style="font-size:10px;color:rgba(255,200,0,.6);margin-top:3px">⏳ รอตรวจสอบ ${pend} คน</div>`:''}
    </div>`;
  }).join('');

function renderUserLB(){
  const board=calcBoard(S.users,S.payments);
  const mode=S.lbMode||'speed';
  const total=S.expenses.length;
  const uid=S.session?.uid;
  const MEDAL=['🥇','🥈','🥉'];
  const RING=[
    {border:'rgba(245,200,66,.6)',bg:'rgba(245,200,66,.08)',col:'#f5c842',cls:'r1',h:160,extra:'<span style="font-size:18px;animation:crown 1.5s ease-in-out infinite;display:inline-block">👑</span>'},
    {border:'rgba(192,192,192,.5)',bg:'rgba(192,192,192,.06)',col:'#d0d0d0',cls:'r2',h:128},
    {border:'rgba(205,127,50,.5)',bg:'rgba(205,127,50,.06)',col:'#cd9a52',cls:'r3',h:104},
  ];
  let sorted=[...board];
  if(mode==='complete')sorted=[...board].sort((a,b)=>b.cnt-a.cnt||(a.first-b.first));
  else if(mode==='unpaid')sorted=[...board].sort((a,b)=>a.cnt-b.cnt);
  const ORDER=[1,0,2];
  const podium=ORDER.map((idx,col)=>{
    const u=sorted[idx];if(!u)return`<div style="flex:1;max-width:${col===1?175:150}px"></div>`;
    const r=RING[idx]||RING[2];
    const pts=idx===0?Array.from({length:14},(_,i)=>{const a=(i/14)*2*Math.PI,d=42+Math.random()*16;return`<div style="position:absolute;width:4px;height:4px;border-radius:50%;background:hsl(${40+i*5},100%,65%);top:50%;left:50%;margin:-2px;--tx:${(Math.cos(a)*d).toFixed(1)}px;--ty:${(Math.sin(a)*d).toFixed(1)}px;animation:particle 2.2s ease-out ${((i/14)*2.2).toFixed(2)}s infinite"></div>`}).join(''):'';
    return`<div style="flex:1;max-width:${col===1?175:150}px;animation:fadeUp .5s ease ${col*.12}s both">
      <div class="${r.cls}" style="background:${r.bg};border:1px solid ${r.border};border-radius:16px;padding:${col===1?'18px 12px':'12px 8px'};text-align:center;position:relative;overflow:hidden;min-height:${r.h}px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:${col===1?4:3}px">
        <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none">${pts}</div>
        <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:${col===1?4:3}px">
          ${r.extra||''}
          <span style="font-size:${col===1?26:18}px">${MEDAL[idx]}</span>
          <span class="num-rank" style="font-size:${col===1?30:20}px;color:${r.col}">#${idx+1}</span>
          <span style="font-size:${col===1?13:10}px;font-weight:600;color:${r.col};text-align:center;line-height:1.3${u.id===uid?';text-decoration:underline':''}">${u.name}</span>
          ${u.nick?`<span style="font-size:9px;color:${r.col};opacity:.7">(${u.nick})</span>`:''}
          <div><span class="num-rank" style="font-size:${col===1?18:14}px;color:#00dc64">${u.cnt}</span><span style="font-size:10px;color:rgba(255,255,255,.35)">/${total}</span></div>
          ${u.cnt>0&&mode==='speed'?`<span style="font-size:9px;color:rgba(255,255,255,.3)">${shortDate(u.first)}</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
  const rank=sorted.findIndex(b=>b.id===uid)+1;
  const rest=sorted.length>3?sorted.slice(3).map((u,i)=>`<div class="glass" style="padding:11px 15px;display:flex;align-items:center;gap:12px;animation:slideIn .3s ease ${i*.04}s both">
    <div class="num-rank" style="font-size:14px;color:rgba(255,255,255,.28);width:28px;text-align:center">#${i+4}</div>
    <div style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600${u.id===uid?';color:#00d4ff':''}">${u.name[1]||u.name[0]}</div>
    <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:${u.id===uid?'600':'400'};color:${u.id===uid?'#00d4ff':'inherit'}">${u.name} ${u.nick?`<span style="font-size:10px;opacity:.5">(${u.nick})</span>`:''}</div>
    <div style="font-size:10px;color:rgba(255,255,255,.32);margin-top:1px">${u.cnt>0?`${u.cnt}/${total} รายการ${mode==='speed'?` · ${shortDate(u.first)}`:''}`:mode==='unpaid'?'ค้างจ่ายทุกรายการ':'ยังไม่จ่ายเลย'}</div></div>
    <div class="num-rank" style="font-size:17px;color:${u.cnt>0?'#00dc64':'rgba(255,255,255,.2)'}">${u.cnt}</div>
  </div>`).join(''):'';
  const confetti=Array.from({length:22},(_,i)=>{const x=Math.random()*100,h=Math.random()*360,sz=4+Math.random()*5,dur=2.5+Math.random()*2.5,dl=Math.random()*1.5;return`<div style="position:fixed;left:${x.toFixed(1)}%;top:-20px;width:${sz.toFixed(0)}px;height:${sz.toFixed(0)}px;border-radius:${Math.random()>.5?'50%':'2px'};background:hsl(${h.toFixed(0)},90%,65%);animation:confetti ${dur.toFixed(1)}s ease ${dl.toFixed(1)}s both;pointer-events:none;z-index:5"></div>`}).join('');
  return`${confetti}<div style="padding:14px;max-width:680px;margin:0 auto">
    <div style="display:flex;gap:4px;margin-bottom:14px">
      ${[{m:'speed',l:'จ่ายไว'},{m:'complete',l:'ครบมากสุด'},{m:'unpaid',l:'ยังไม่จ่าย'}].map(t=>`<button class="tab${mode===t.m?' on':''}" onclick="ss({lbMode:'${t.m}'})" style="flex:1;text-align:center">${t.l}</button>`).join('')}
    </div>
    <div style="display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-bottom:20px">${podium}</div>
    ${rest?`<div style="font-size:11px;color:rgba(255,255,255,.25);text-align:center;margin-bottom:10px;letter-spacing:1px">— อันดับที่เหลือ —</div><div style="display:flex;flex-direction:column;gap:7px">${rest}</div>`:''}
    ${rank>3?`<div class="glass" style="padding:12px 16px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(0,212,255,.2)">
      <div style="font-size:13px">อันดับของคุณ</div>
      <div class="num-rank" style="font-size:24px;color:#00d4ff">#${rank}</div>
    </div>`:''}
  </div>`;
}

  const aiOk=pend.filter(p=>{try{const ai=JSON.parse(p.ai_verdict||'null');return ai&&ai.verdict==='likely_real';}catch{return false;}});
  const header=aiFake.length?`<div style="background:rgba(255,60,60,.1);border:1px solid rgba(255,60,60,.25);border-radius:10px;padding:12px 15px;margin-bottom:14px;display:flex;align-items:center;gap:8px"><span style="font-size:16px">🚨</span><div><div style="font-size:13px;font-weight:600;color:#ff7070">${aiFake.length} รายการที่ AI ตรวจว่าผิดปกติ</div><div style="font-size:11px;color:rgba(255,255,255,.4);margin-top:2px">ตรวจสอบรายการเหล่านี้ก่อน</div></div></div>`:'';
  const rows=[...aiFake,...aiSusp,...pend.filter(p=>!aiFake.includes(p)&&!aiSusp.includes(p))].map((p,i)=>{
    const u=users.find(x=>x.id===p.uid);const e=expenses.find(x=>x.id===p.eid);
    let aiR=null;try{aiR=JSON.parse(p.ai_verdict||'null');}catch{}
    const borderC=aiR?.verdict==='fake'?'rgba(255,60,60,.35)':aiR?.verdict==='suspicious'?'rgba(255,200,0,.25)':aiR?.verdict==='likely_real'?'rgba(0,220,100,.2)':'rgba(255,255,255,.09)';
    return`<div class="glass" style="padding:16px;animation:slideIn .3s ease ${i*.06}s both;border:1px solid ${borderC}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">
        <div><div style="font-weight:700;font-size:15px">${u?.name}</div>
        <div style="font-size:12px;color:rgba(255,255,255,.45);margin-top:2px">${e?.name} · ${thb(e?.amount||0)}</div>
        <div style="font-size:10px;color:rgba(255,255,255,.3);margin-top:2px">${fullDate(p.paidAt)}</div></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
          <span class="bp">รอตรวจ</span>
          ${aiR?aiVerdict(aiR,true):`<span class="bai-err"><i class="ti ti-question-mark"></i>ไม่มี AI</span>`}
        </div>
      </div>
      ${p.slip?`<div style="margin-bottom:12px;cursor:pointer" onclick="ss({slipZoom:'${p.slip}'})">
        <img src="${p.slip}" style="max-width:100%;max-height:180px;border-radius:10px;object-fit:contain;border:1px solid rgba(255,255,255,.12);display:block"/>
        <div style="font-size:10px;color:rgba(0,212,255,.6);margin-top:5px;text-align:center"><i class="ti ti-zoom-in" style="font-size:12px"></i> กดเพื่อขยาย</div>
      </div>`:`<div style="padding:18px;text-align:center;color:rgba(255,255,255,.28);font-size:12px;margin-bottom:12px">ไม่มีสลิป</div>`}
      ${aiR&&!aiR.issues?.length&&aiR.verdict==='likely_real'?'':aiR?aiVerdict(aiR,false):''}
      <div style="display:flex;gap:8px">
        <button class="btn-s" onclick="approvePayment('${p.id}')" style="flex:1">✅ อนุมัติ</button>
        <button class="btn-d" onclick="rejectPayment('${p.id}')" style="flex:1">❌ ปฏิเสธ</button>
      </div>
    </div>`;
  }).join('');
  return`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <h3 style="font-size:13px;font-weight:600">รอตรวจสอบ <span class="num" style="color:#ffc800">${pend.length}</span> รายการ</h3>
    ${aiOk.length?`<button class="btn-s" onclick="batchApprove()" style="font-size:12px;padding:7px 14px">✅ อนุมัติ AI-ผ่าน ทั้งหมด (${aiOk.length})</button>`:''}
  </div>
  ${header}
  <div style="display:flex;flex-direction:column;gap:14px">${rows}</div>`;
}

  const{savedBalance,payments,expenses}=S;
  const got=payments.filter(p=>p.status==='verified').reduce((s,p)=>{const e=expenses.find(x=>x.id===p.eid);return s+(e?.amount||0)},0);
  return`<div style="max-width:480px">
    <div class="glass" style="padding:24px">
      <h3 style="font-size:15px;font-weight:600;margin-bottom:18px">💵 ยอดเงินสะสม</h3>

        ${[{l:'ยอดสะสม ปี 2568',v:thb(savedBalance),c:'#f5c842'},{l:'เก็บได้ ปี 2569',v:thb(got),c:'#00dc64'},{l:'รวมทั้งหมด',v:thb(savedBalance+got),c:'#00d4ff'}].map(s=>`<div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px;text-align:center"><div style="font-size:11px;color:rgba(255,255,255,.38);margin-bottom:5px">${s.l}</div><div class="num-lg" style="color:${s.c}">${s.v}</div></div>`).join('')}
      </div>
      <div style="font-size:12px;font-weight:600;margin-bottom:8px;color:rgba(255,255,255,.55)">✏️ แก้ไขยอดสะสม ปี 2568</div>
      <div style="display:flex;gap:8px">
        <input id="bali" type="number" value="${savedBalance}"/>
        <button class="btn-s" onclick="updateBal()" style="white-space:nowrap">บันทึก</button>

  const fake=`<div style="min-height:100vh;position:relative;z-index:1">

// ── ACTIONS ──
function togglePay(id){
  const sel=S.paySelected||[];
  const idx=sel.indexOf(id);
  if(idx>=0)ss({paySelected:sel.filter(x=>x!==id)});
  else ss({paySelected:[...sel,id]});
}

function goToQR(){if((S.paySelected||[]).length===0)return;ss({payStep:2});}

async function onSlipUpload(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async ev=>{
    const slip=ev.target.result;
    const sel=S.paySelected||[];
    const items=sel.map(id=>S.expenses.find(e=>e.id===id)).filter(Boolean);
    const total=items.reduce((s,e)=>s+e.amount,0);
    ss({paySlip:slip,payAiResult:null,payAiLoading:true});
    await verifySlip(slip,total,items);
  };
  r.readAsDataURL(f);
}

function clearSlip(){ss({paySlip:null,payAiResult:null,payAiLoading:false});}

async function submitPay(uid,eids){
  const slip=S.paySlip;
  if(!slip)return;
  const hash=hashSlip(slip);
  const aiJson=S.payAiResult?JSON.stringify(S.payAiResult):null;
  const rows=eids.map(eid=>({id:'p'+Date.now()+Math.random().toString(36).slice(2),uid,eid,status:'pending',paid_at:Date.now(),slip,slip_hash:hash,ai_verdict:aiJson}));
  S.payments=[...S.payments,...rows.map(r=>({...r,paidAt:r.paid_at}))];
  ss({payStep:3});
  for(const row of rows){
    await db.from('payments').insert({id:row.id,uid:row.uid,eid:row.eid,status:'pending',paid_at:row.paid_at,slip:row.slip,slip_hash:row.slip_hash,ai_verdict:row.ai_verdict});
  }
  showToast('ส่งสำเร็จ! รอ Admin ยืนยัน ✅','success');
}

async function approvePayment(id){
  S.payments=S.payments.map(p=>p.id===id?{...p,status:'verified'}:p);ss({});
  await db.from('payments').update({status:'verified'}).eq('id',id);
  showToast('อนุมัติแล้ว ✅','success');
}

async function rejectPayment(id){
  S.payments=S.payments.filter(p=>p.id!==id);ss({});
  await db.from('payments').delete().eq('id',id);
  showToast('ปฏิเสธแล้ว');
}

async function batchApprove(){
  const pend=S.payments.filter(p=>{try{const ai=JSON.parse(p.ai_verdict||'null');return p.status==='pending'&&ai?.verdict==='likely_real';}catch{return false;}});
  for(const p of pend){
    S.payments=S.payments.map(x=>x.id===p.id?{...x,status:'verified'}:x);
    await db.from('payments').update({status:'verified'}).eq('id',p.id);
  }
  ss({});showToast(`อนุมัติ ${pend.length} รายการ ✅`,'success');
}

async function addExp(){
  const name=document.getElementById('exn')?.value?.trim();
  const amt=+document.getElementById('exa')?.value;
  const desc=document.getElementById('exd')?.value?.trim()||'';
  if(!name||!amt)return;
  const e={id:'e'+Date.now(),name,amount:amt,desc,at:Date.now()};
  S.expenses=[...S.expenses,e];ss({});
  await db.from('expenses').insert({id:e.id,name:e.name,amount:e.amount,desc:e.desc,at:e.at});
}

async function delExp(id){S.expenses=S.expenses.filter(e=>e.id!==id);ss({});await db.from('expenses').delete().eq('id',id);}

async function addUser(){
  const name=document.getElementById('mbn')?.value?.trim();
  const nick=document.getElementById('mbnk')?.value?.trim()||'';
  const pin=document.getElementById('mbp')?.value?.trim()||'';
  if(!name)return;
  const u={id:'u'+Date.now(),name,nick,pin};
  S.users=[...S.users,u];ss({});
  await db.from('users').insert(u);
}

async function saveEditUser(id){
  const name=document.getElementById('en-'+id)?.value?.trim();
  const nick=document.getElementById('enk-'+id)?.value?.trim()||'';
  const pin=document.getElementById('ep-'+id)?.value?.trim()||'';
  if(!name)return;
  S.users=S.users.map(u=>u.id===id?{...u,name,nick,pin}:u);
  ss({editMbId:null});
  await db.from('users').update({name,nick,pin}).eq('id',id);
}

async function delUser(id){
  S.users=S.users.filter(u=>u.id!==id);S.payments=S.payments.filter(p=>p.uid!==id);ss({});
  await db.from('payments').delete().eq('uid',id);
  await db.from('users').delete().eq('id',id);
}

async function resetUserPay(id){
  S.payments=S.payments.filter(p=>p.uid!==id);ss({editMbId:null});
  await db.from('payments').delete().eq('uid',id);
  showToast('ล้างข้อมูลการจ่ายแล้ว ✅');
}

function clearQR(){S.qr=null;ss({});db.from('config').upsert({key:'qr',value:''});}
function uploadQR(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=async ev=>{S.qr=ev.target.result;ss({});await db.from('config').upsert({key:'qr',value:ev.target.result});};r.readAsDataURL(f);}
async function updateBal(){const v=+document.getElementById('bali')?.value;if(isNaN(v)||v<0)return;S.savedBalance=v;ss({});await db.from('config').upsert({key:'savedBalance',value:String(v)});showToast('บันทึกแล้ว ✅','success');}

function bindEvents(){
  document.querySelectorAll('[data-login="admin"]').forEach(el=>el.addEventListener('click',showAdminForm));
  document.querySelectorAll('[data-login="user"]').forEach(el=>el.addEventListener('click',showUserForm));
  const ap=document.getElementById('apw');if(ap)ap.addEventListener('keydown',e=>{if(e.key==='Enter')doAdminLogin();});
  const up=document.getElementById('upin');if(up)up.addEventListener('keydown',e=>{if(e.key==='Enter')doUserLogin();});
}

function render(){
  const app=document.getElementById('app');
  if(S.loading){
    app.innerHTML=`<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative;z-index:1">
      <div style="font-size:48px;animation:floatY 1.8s ease-in-out infinite">🏦</div>
      <div class="num" style="font-size:15px;font-weight:700;color:#00d4ff;letter-spacing:2px">CLASS FUND v2</div>
      <div style="display:flex;gap:5px">${[0,1,2].map(i=>`<div style="width:7px;height:7px;border-radius:50%;background:#00d4ff;animation:pulse 1.2s ease-in-out ${i*.2}s infinite"></div>`).join('')}</div>
      <div style="font-size:11px;color:rgba(255,255,255,.3)">กำลังโหลดข้อมูล...</div>
    </div>`;
    renderStars();return;
  }
  let html='';
  if(S.view==='login')html=renderLogin();
  else if(S.view==='admin')html=renderAdmin();
  else if(S.view==='lb_admin')html=renderLBAdmin();
  else if(S.view==='user')html=renderUser();
  app.style.transition='opacity .15s ease';
  app.style.opacity='0';
  app.innerHTML=html+renderToast();
  requestAnimationFrame(()=>{app.style.opacity='1';});
  bindEvents();renderStars();
}

async function initApp(){
  S.loading=true;render();
  const ok=await loadData();
  if(!ok){
    S.loading=false;
    document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div class="glass" style="padding:32px;max-width:460px;text-align:center"><div style="font-size:40px;margin-bottom:12px">⚙️</div><h2 style="font-size:16px;font-weight:600;margin-bottom:10px">ยังไม่ได้ตั้งค่า Supabase</h2><p style="font-size:12px;color:rgba(255,255,255,.42);line-height:1.8">ตรวจสอบ SUPABASE_URL และ SUPABASE_KEY ในไฟล์ HTML</p></div></div>`;
    return;
  }
  S.loading=false;
  subscribeRealtime();
  render();
}

initApp();
</script>
